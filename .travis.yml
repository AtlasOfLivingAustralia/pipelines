language: java
dist: focal
jdk:
  - openjdk17

env:
  global:
    - MAVEN_OPTS="-Xmx1g"

branches:
  only:
    - main
    - develop
cache:
  directories:
    - $HOME/.m2
jobs:
  include:
    - stage: Build and Run All Tests
      name: "Build and Tests"
      script:
        - travis_wait 60 mvn verify -DargLine="-Xmx3g -XX:MaxMetaspaceSize=512m"