language: java
sudo: false
jdk:
  - openjdk17
branches:
  only:
    - develop
    - feature/travis-test
cache:
  directories:
    - $HOME/.m2

stages:
  - name: build
  - name: test

jobs:
  include:
    - stage: build
      name: "Compile and Package"
      script:
        - mvn clean package -DskipTests -B -V
        - cd livingatlas
        - mvn clean package -P livingatlas-artifacts -DskipTests -B -V

    - stage: test
      name: "Run Unit and Integration Tests"
      script:
        - cd livingatlas
        - mvn failsafe:integration-test failsafe:verify
